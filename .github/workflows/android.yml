name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx expo export --platform android --output-dir dist
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleRelease
      - name: Validate signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -3
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -5
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          test "$(stat -c%s "$APK")" -gt 30000000
      - uses: actions/upload-artifact@v4
        with:
          name: mesa-de-cartas-android-validation
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
